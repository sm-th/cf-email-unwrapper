[project]
name = "cf-email-unwrapper"
version = "0.1.0"
description = "S/MIME email <-> A2A bridge for one agent (Cloudflare Queues + R2)"
readme = "README.md"
authors = [
    { name = "Andy Smith", email = "me@andysmith.ai" }
]
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.3.0",
    "asn1crypto>=1.5.1",
    "boto3>=1.43.121",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
cf-email-unwrapper = "cf_email_unwrapper.__main__:run"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
